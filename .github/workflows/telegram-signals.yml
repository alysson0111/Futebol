name: Sinais Telegram em segundo plano
on:
  push:
    branches: [main]
    paths: ['.github/workflows/telegram-signals.yml']
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
permissions:
  id-token: write
concurrency:
  group: telegram-signals
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Executar scanner protegido
        env:
          AUTOMATION_URL: ${{ vars.AUTOMATION_URL || 'https://futebol-jet.vercel.app/api/automation/run' }}
          AUTOMATION_AUDIENCE: ${{ vars.AUTOMATION_AUDIENCE || 'https://futebol-jet.vercel.app' }}
        run: |
          node --input-type=module <<'JS'
          const url = new URL(process.env.AUTOMATION_URL);
          if (url.protocol !== 'https:') throw new Error('O agendador exige HTTPS.');
          const identity = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          identity.searchParams.set('audience',process.env.AUTOMATION_AUDIENCE);
          const auth = await fetch(identity,{headers:{Authorization:`Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`},redirect:'error',signal:AbortSignal.timeout(10000)});
          if(!auth.ok)throw new Error('Nao foi possivel autenticar o workflow.');
          const {value:token}=await auth.json();
          console.log(`::add-mask::${token}`);
          let response;
          for(let attempt=0;attempt<5;attempt++) {
            response = await fetch(url, {
              method: 'POST',headers: {'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json'},
              body: '{}',redirect: 'error',signal: AbortSignal.timeout(70000)
            });
            if(![401,404].includes(response.status)||attempt===4)break;
            await new Promise(resolve=>setTimeout(resolve,15000));
          }
          const result = await response.json();
          if (!response.ok) throw new Error(`Automacao falhou: HTTP ${response.status}. Confira os logs da Vercel.`);
          console.log(JSON.stringify(result));
          if (result.failed) throw new Error('Sinais salvos, mas houve falha de envio ao Telegram. Confira o relatorio.');
          JS
