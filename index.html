<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Análise de Jogos IA</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="topbar">
        <div class="brand-block">
          <div class="brand-mark">AV</div>
          <div>
            <p class="eyebrow">API-Football + IA preditiva</p>
            <h1>Análise de Jogos</h1>
          </div>
        </div>
        <div class="top-links market-alert-nav" aria-label="Alertas por mercado">
          <button class="market-alert-tab active" type="button" data-market-type="match-goal">
            <span>Partida +0.5</span><b data-market-count="match-goal">0</b>
          </button>
          <button class="market-alert-tab" type="button" data-market-type="over-25">
            <span>Over 2.5</span><b data-market-count="over-25">0</b>
          </button>
          <button class="market-alert-tab" type="button" data-market-type="under-25">
            <span>Under 2.5</span><b data-market-count="under-25">0</b>
          </button>
          <button class="market-alert-tab" type="button" data-market-type="handicap">
            <span>Handicap</span><b data-market-count="handicap">0</b>
          </button>
          <button class="market-alert-tab" type="button" data-market-type="corners">
            <span>Escanteios</span><b data-market-count="corners">0</b>
          </button>
        </div>
        <div class="status-pill" id="sourceStatus">Conectando</div>
      </section>

      <section class="controls">
        <div class="filters-row">
        <label>
          Data
          <input id="dateInput" type="date">
        </label>
        <label>
          Esporte
          <select id="sportInput">
            <option value="football">Futebol</option>
            <option value="tennis">Tênis</option>
            <option value="volleyball">Vôlei</option>
          </select>
        </label>
        <label>
          Buscar
          <input id="searchInput" type="search" placeholder="Time, liga ou país">
        </label>
        <label>
          Campeonato
          <select id="leagueFilter">
            <option value="">Todos os campeonatos</option>
          </select>
        </label>
        <button id="startedToggle" class="secondary-button" type="button" aria-pressed="false">Ao vivo agora</button>
        </div>
        <div class="signals-row">
        <button id="matchGoalButton" class="secondary-button goal-alert-button hidden" type="button">Partida +0.5 gol</button>
        <label class="compact-label market-label hidden">
          Mercado do sinal
          <select id="resultsType">
            <option value="match-goal">Partida +0.5 gol</option>
            <option value="over-25">Over 2.5 gols</option>
            <option value="under-25">Under 2.5 gols</option>
            <option value="handicap">Handicap Asiático</option>
            <option value="corners">Escanteios</option>
          </select>
        </label>
        <label class="compact-label stake-label">
          Valor aposta
          <input id="stakeInput" type="number" min="0" step="1" value="10">
        </label>
        <button id="resultsButton" class="secondary-button" type="button">Ver acertos</button>
        <button id="reportButton" class="secondary-button" type="button">Relatório por período</button>
        <button id="minuteSimulatorButton" class="secondary-button" type="button">Simular por minuto</button>
        <button id="loadButton" type="button">Atualizar jogos</button>
        </div>
      </section>
      <p id="sourceMessage" class="source-message hidden"></p>

      <section class="workspace">
        <aside class="match-list">
          <div class="section-title">
            <h2>Jogos</h2>
            <span id="matchCount">0</span>
          </div>
          <div id="matches"></div>
        </aside>

        <section class="analysis-panel">
          <div id="emptyState" class="empty-state">
            <h2>Selecione um confronto</h2>
            <p>Escolha um confronto ou consulte os sinais de Partida +0.5 gol.</p>
          </div>

          <div id="resultsPanel" class="results-panel hidden"></div>

          <div id="analysisState" class="hidden">
            <div class="fixture-head">
              <div>
                <p id="leagueName" class="eyebrow"></p>
                <h2 id="fixtureTitle"></h2>
                <p id="fixtureMeta"></p>
              </div>
              <button id="predictButton" type="button">Gerar previsão</button>
            </div>

            <div class="inputs-grid">
              <label>Forma mandante <input id="formHome" type="number" min="0" max="100" placeholder="auto"></label>
              <label>Forma visitante <input id="formAway" type="number" min="0" max="100" placeholder="auto"></label>
              <label>Ataque mandante <input id="attackHome" type="number" min="0" max="100" placeholder="auto"></label>
              <label>Ataque visitante <input id="attackAway" type="number" min="0" max="100" placeholder="auto"></label>
              <label>Defesa mandante <input id="defenseHome" type="number" min="0" max="100" placeholder="auto"></label>
              <label>Defesa visitante <input id="defenseAway" type="number" min="0" max="100" placeholder="auto"></label>
              <label>Desfalques mandante <input id="absencesHome" type="number" min="0" max="12" value="0"></label>
              <label>Desfalques visitante <input id="absencesAway" type="number" min="0" max="12" value="0"></label>
            </div>

            <div id="prediction" class="prediction hidden"></div>
          </div>
        </section>
      </section>
    </main>
    <dialog id="reportDialog" class="report-dialog">
      <form method="dialog" class="report-dialog-head">
        <div>
          <p class="eyebrow">Relatórios salvos</p>
          <h2>Consultar sinais</h2>
        </div>
        <button class="dialog-close" type="submit" aria-label="Fechar">×</button>
      </form>
      <div class="report-dialog-fields">
        <label>
          Data inicial
          <input id="reportDateInput" type="date">
        </label>
        <label>
          Data final
          <input id="reportEndDateInput" type="date">
        </label>
        <label>
          Tipo de sinal
          <select id="reportTypeInput">
            <option value="match-goal">Partida +0.5 gol</option>
            <option value="over-25">Over 2.5 gols</option>
            <option value="under-25">Under 2.5 gols</option>
            <option value="handicap">Handicap Asiático</option>
            <option value="corners">Escanteios</option>
          </select>
        </label>
      </div>
      <div class="report-dialog-actions">
        <button id="consultReportButton" type="button">Consultar relatório</button>
      </div>
    </dialog>
    <dialog id="minuteSimulatorDialog" class="report-dialog">
      <form method="dialog" class="report-dialog-head">
        <div>
          <p class="eyebrow">Backtest historico</p>
          <h2>Simular +0.5 por minuto</h2>
        </div>
        <button class="dialog-close" type="submit" aria-label="Fechar">x</button>
      </form>
      <div class="report-dialog-fields simulator-fields">
        <label>
          Mercado
          <select id="simulatorMarketInput">
            <option value="match-over-05">Partida +0.5 gol</option>
            <option value="match-over-goals">Over gols</option>
            <option value="match-under-goals">Under gols</option>
            <option value="handicap">Handicap</option>
            <option value="corners">Escanteios</option>
          </select>
        </label>
        <label>
          Data inicial
          <input id="simulatorStartDateInput" type="date">
        </label>
        <label>
          Data final
          <input id="simulatorEndDateInput" type="date">
        </label>
        <label>
          Minuto de entrada
          <input id="simulatorMinuteInput" type="number" min="1" max="90" value="80">
        </label>
      </div>
      <div class="report-dialog-actions">
        <button id="runMinuteSimulatorButton" type="button">Rodar simulacao</button>
      </div>
    </dialog>
    <script src="./app.js" type="module"></script>
  </body>
</html>
