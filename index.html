<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Central Esportiva</title>
  <link rel="stylesheet" href="/sports.css">
</head>
<body>
  <header class="header">
    <div class="brand"><span class="brand-mark">CE</span><div><h1>Central Esportiva</h1><p>Calendário e resultados</p></div></div>
    <span id="connection" role="status">Conectando</span>
  </header>
  <div class="app-layout">
  <nav id="markets" class="market-sidebar" aria-label="Mercados">
    <button data-market="general" aria-pressed="true">Painel geral</button>
    <button data-market="over-05" aria-pressed="false">+0.5 gols <span></span></button>
    <button data-market="over-15" aria-pressed="false">+1.5 gols <span></span></button>
    <button data-market="over-25" aria-pressed="false">+2.5 gols <span></span></button>
    <button data-market="under-25" aria-pressed="false">Under 2.5 <span></span></button>
    <button data-market="under-35" aria-pressed="false">Under 3.5 IA <span></span></button>
    <button data-market="corners" aria-pressed="false">Escanteios <span></span></button>
    <button data-market="handicap" aria-pressed="false">Handicap <span></span></button>
    <button data-market="ml" aria-pressed="false">ML <span></span></button>
  </nav>
  <main>
    <nav id="sports" class="sport-tabs" aria-label="Modalidades">
      <button data-sport="football" aria-pressed="true">Futebol</button>
      <button data-sport="tennis" aria-pressed="false">Tênis</button>
      <button data-sport="eafootball" aria-pressed="false">EA Sports FC/FIFA</button>
      <button data-sport="basketball" aria-pressed="false">Basquete</button>
      <button data-sport="nfl" aria-pressed="false">NFL</button>
    </nav>
    <section class="filters" aria-label="Filtros de partidas">
      <label>Fonte<select id="provider"><option value="kalshi">Kalshi</option><option value="apisports">API-Sports</option></select></label>
      <label>Data<input id="date" type="date" required></label>
      <label>Buscar<input id="search" type="search" placeholder="Equipe ou campeonato"></label>
      <label>Campeonato<select id="league"><option value="">Todos</option></select></label>
      <label>Situação<select id="phase"><option value="">Todas</option><option value="live">Ao vivo</option><option value="scheduled">Agendados</option><option value="finished">Encerrados</option><option value="other">Outros</option></select></label>
      <button id="refresh" class="primary" type="button">Atualizar</button>
      <button id="openReport" type="button">Relatório por período</button>
    </section>
    <p id="message" role="status" hidden></p>
    <section class="summary" aria-label="Resumo do dia">
      <div><span>Partidas</span><strong id="total">0</strong></div>
      <div><span>Ao vivo</span><strong id="live">0</strong></div>
      <div><span>Agendadas</span><strong id="scheduled">0</strong></div>
      <div><span>Encerradas</span><strong id="finished">0</strong></div>
      <div class="update"><span>Última atualização</span><strong id="updated">--</strong></div>
    </section>
    <section id="scannerPanel" class="scanner-panel" hidden>
      <div class="section-title"><h2 id="scannerTitle">Scanner</h2><button id="scanMarkets" type="button" class="primary">Verificar jogos</button></div>
      <div class="scanner-controls"><label>Confiabilidade mínima (%)<input id="minConfidence" type="number" min="0" max="100" value="0"></label><label class="switch-label"><input id="approvedOnly" type="checkbox">Só entradas aprovadas</label><label class="switch-label"><input id="autoSignals" type="checkbox">Envio automático ao Telegram</label><label>Token de envio<input id="scannerToken" type="password" autocomplete="off"></label></div>
      <p id="scannerStatus" role="status"></p><div id="scannerResults" aria-live="polite"></div>
    </section>
    <section class="workspace">
      <div class="schedule"><div class="section-title"><h2 id="listTitle">Jogos do dia</h2><span id="count">0 partidas</span></div><div id="games" aria-live="polite"></div></div>
      <aside id="detail" class="detail" aria-live="polite"><h2>Detalhes da partida</h2><p class="muted">Nenhuma partida selecionada.</p></aside>
    </section>
  </main>
  </div>
  <dialog id="reportDialog">
    <form id="reportForm">
      <div class="section-title"><h2>Relatório de partidas</h2><button id="closeReport" type="button" aria-label="Fechar">Fechar</button></div>
      <div class="report-filters"><label>Data inicial<input id="startDate" type="date" required></label><label>Data final<input id="endDate" type="date" required></label><button id="generateReport" type="submit" class="primary">Consultar</button></div>
      <p id="reportStatus" role="status"></p>
      <div class="report-actions"><button id="csv" type="button" disabled>Exportar CSV</button><button id="print" type="button" disabled>Imprimir / PDF</button></div>
      <div id="reportContent"></div>
    </form>
  </dialog>
  <script type="module" src="/sports-dashboard.js"></script>
</body>
</html>
